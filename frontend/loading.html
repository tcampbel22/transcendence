<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="/images/favicon.webp"/>
    <title>Loading...</title>
	<script nonce="NONCE">
		const urls = ['/user', '/game']; // List of URLs to fetch from

		setInterval(() => {
			Promise.all(
				urls.map(url =>
					fetch(url)
						.then(res => {
							if (res.status === 200) {
								return { url, success: true };
							}
							return { url, success: false };
						})
						.catch(() => ({ url, success: false }))
				)
			).then(results => {
				const successful = results.find(result => result.success);
				if (successful) {
					window.location.href = '/index.html?nocache=' + new Date().getTime();
				} else {
					console.error("Failed to reach all services");
				}
			});
		}, 3000);
	</script>
	<style>
		html, body {
			height: 100%;
			margin: 1;
			font-family: monospace;
			background-color: #111827;
			color: #fde68a;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			font-size: x-large;
			text-align: center;
		}
		img {
			height: 100%;
			width: 100%;
			object-fit: contain;
			margin-bottom: 6px;
		}
		span {
			padding: 4px;
			margin-top: 6px;
			margin-bottom: 6px;
		}
		div {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
		}
		.loader {
			width: 50px;
			aspect-ratio: 1;
			border-radius: 50%;
			border: 8px solid #0000;
			border-right-color: #fde68a;
			position: relative;
			animation: l24 1s infinite linear;
			margin-top: 10px;
		}
		.loader:before,
		.loader:after {
			content: "";
			position: absolute;
			inset: -8px;
			border-radius: 50%;
			border: inherit;
			animation: inherit;
			animation-duration: 2s;
		}
		.loader:after {
			animation-duration: 4s;
		}
		@keyframes l24 {
			100% {transform: rotate(1turn)}
		}
	</style>
</head>
<body>
	<div>
		<img src="/images/pong_12.svg" alt="Loading..."/>
		<span>I'm cheap so please wait for the servers to spin up...</span>
		<div class="loader"></div>
	</div>
   
</body>
</html>
